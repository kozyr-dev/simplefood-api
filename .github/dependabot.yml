# Weekly update PRs, each checked by CI before you merge it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for all @nestjs/* packages: they're released together and
      # mixing versions breaks peer dependencies.
      nestjs:
        patterns: ['@nestjs/*']
      # One PR for the rest of the dev tooling.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  # The admin app (its own package).
  - package-ecosystem: npm
    directory: /admin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # react-admin and its ra-* packages are released together.
      react-admin:
        patterns: ['react-admin', 'ra-*']
      mui:
        patterns: ['@mui/*']
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  # The Node base image in the Dockerfile. Patch and minor releases only:
  # the major follows .nvmrc, changed by hand.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']

  # Postgres in the production Compose file. Patch and minor releases only:
  # a major version needs a dump and restore.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
