# Weekly update PRs, each checked by CI before you merge it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for all @nestjs/* packages: they're released together and
      # mixing versions breaks peer dependencies.
      nestjs:
        patterns: ['@nestjs/*']
      # One PR for the rest of the dev tooling.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  # The admin app (its own package).
  - package-ecosystem: npm
    directory: /admin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # react-admin and its ra-* packages are released together.
      react-admin:
        patterns: ['react-admin', 'ra-*']
      mui:
        patterns: ['@mui/*']
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
